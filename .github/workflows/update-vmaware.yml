name: Update vendored VMAware

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-vmaware
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Fetch upstream update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/update-vmaware.sh

      - name: Open update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update vendored VMAware"
          branch: automation/update-vmaware
          delete-branch: true
          title: "chore: update vendored VMAware"
          body: |
            Updates `vendor/vmaware.hpp` from NotRequiem/VMAware,
            regenerates `src/technique.rs`, and records the new SHA-256 checksum.
          labels: dependencies
          add-paths: |
            src/technique.rs
            vendor/vmaware.hpp
            vendor/vmaware.sha256
