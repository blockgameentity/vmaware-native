name: Update vendored VMAware

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check for and validate upstream update
        run: bash ci/update-vmaware.sh

      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- \
            src/technique.rs \
            vendor/vmaware.hpp \
            vendor/vmaware.sha256; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open update pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update vendored VMAware"
          branch: automation/update-vmaware
          delete-branch: true
          title: "chore: update vendored VMAware"
          body: |
            Updates `vendor/vmaware.hpp` from kernelwernel/VMAware,
            regenerates `src/technique.rs`, and records the new SHA-256 checksum.
          labels: dependencies
          add-paths: |
            src/technique.rs
            vendor/vmaware.hpp
            vendor/vmaware.sha256
